<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" role="img" aria-labelledby="t d"><title id="t">CAPSTONE-12 I2C Bus Health Monitor</title><desc id="d">SCL SDA inputs through 3.3V GPIO and synchronizer to watchdog, fault LED and registers, AXI SoC expansion</desc><style>text{font:16px sans-serif;fill:#203249}.small{font-size:12px}.box{fill:#eaf3fa;stroke:#27658e;stroke-width:2;rx:12}.out{fill:#e9f6e9;stroke:#34824d;stroke-width:2;rx:12}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#475569"/></marker></defs><rect width="1040" height="310" fill="#fff"/><rect class="box" x="20" y="78" width="160" height="78"/><text x="35" y="109">3.3V I²C bus</text><text class="small" x="35" y="135">scl_in / sda_in</text><rect class="box" x="220" y="78" width="170" height="78"/><text x="231" y="107">3.3V GPIO</text><text class="small" x="231" y="131">i2c_line_sync</text><rect class="box" x="430" y="78" width="190" height="78"/><text x="442" y="108">i2c_bus_watchdog</text><text class="small" x="442" y="134">FSM / timeout</text><rect class="out" x="675" y="20" width="175" height="65"/><text x="690" y="47">fault_led</text><text class="small" x="690" y="68">Basys3 LED</text><rect class="out" x="675" y="120" width="185" height="84"/><text x="687" y="147">fault_flags</text><text class="small" x="687" y="168">event_count</text><text class="small" x="687" y="187">low_ticks</text><rect class="box" x="875" y="120" width="145" height="84"/><text x="886" y="150">AXI4-Lite</text><text class="small" x="886" y="174">MicroBlaze V</text><path class="arr" d="M180 116H218"/><path class="arr" d="M390 116H428"/><path class="arr" d="M620 106H645V52H673"/><path class="arr" d="M620 136H673"/><path class="arr" d="M860 160H873"/><text class="small" x="24" y="264">Design only · input-only bus observer · FPGA GPIO 3.3V maximum · no 5V pullups</text></svg>