name: RTL 32 lessons directed verification
on:
  # (추가) 하네스 반복 검증: RTL 기능 회귀는 코드 변경이 없어도 수행한다.
  schedule:
    - cron: '12 * * * *'
  push:
    paths:
      - 'rtl/**'
      - '.github/workflows/rtl-tests.yml'
  pull_request:
    paths:
      - 'rtl/**'
      - '.github/workflows/rtl-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Width lint (state/literal truncation)
        run: python3 rtl/verification/lint_widths.py
      - name: Run RTL directed tests
        run: bash rtl/verification/rtl/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl-directed-results
          path: rtl/verification/rtl/results/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl-directed-summary
          path: rtl/verification/rtl/results/rtl-summary.tsv
          if-no-files-found: warn
