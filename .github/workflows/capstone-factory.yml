name: Always create a new Arduino capstone
on:
  schedule:
    # Every 3h at :40 UTC; offset from ChatGPT 3h reservation to reduce collisions.
    - cron: '40 1-23/3 * * *'
  push:
    branches: [main]
    paths:
      - devices/tools/capstone_factory.py
      - .github/workflows/capstone-factory.yml
  workflow_dispatch:

permissions:
  contents: write
  # (추가) GITHUB_TOKEN 커밋은 다른 push 워크플로를 자동 실행하지 않으므로
  # 검증 워크플로를 workflow_dispatch로 명시적으로 실행한다.
  actions: write

concurrency:
  group: dev-board-creative-capstone
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Self-test capstone generator
        run: python3 devices/tools/capstone_factory.py --selftest
      - name: Create at least one genuinely new project and its HTML
        run: python3 devices/tools/capstone_factory.py
      - name: Regenerate site navigation and verify links
        run: |
          python3 devices/tools/gen_pages.py
          python3 devices/tools/check_links.py
          python3 devices/tools/gen_pages.py --check
      - name: Commit and publish new capstone
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No new capstone generated" >&2
            exit 1
          fi
          git commit -m "automation: generate one new creative Arduino capstone"
          if git push origin HEAD:main; then
            exit 0
          fi
          # (변경) 다른 예약 작업이 먼저 main을 갱신했으면 최신 소스에서
          # 신규 캡스톤을 다시 생성하여 번호 충돌과 비-fast-forward 실패를 방지한다.
          for attempt in 1 2 3; do
            echo "Concurrent update; rebuild a NEW capstone from latest main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python3 devices/tools/capstone_factory.py
            python3 devices/tools/gen_pages.py
            python3 devices/tools/check_links.py
            python3 devices/tools/gen_pages.py --check
            git add -A
            if git diff --cached --quiet; then
              echo "ERROR: no new capstone after retry" >&2
              exit 1
            fi
            git commit -m "automation: generate a new capstone after concurrent update"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "ERROR: capstone publication failed after three retries" >&2
          exit 1

      # (추가) 자동 생성 커밋의 실제 최신 main을 전체 CI로 재검증한다.
      # 이 요청의 성공과 전체 CI의 최종 통과는 구분한다.
      - name: Request full regression on published capstone
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run devices-check.yml --ref main
