name: Harness regression issue tracker

on:
  # (추가) CI가 끝날 때마다 실패를 1개 Issue로 추적하고 복구 시 닫는다.
  workflow_run:
    workflows:
      - Devices docs, sources and host verification
      - RTL 32 lessons directed verification
      - RTL Verilator lint
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  track:
    if: >-
      ${{ github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event != 'pull_request' &&
          (github.event.workflow_run.conclusion == 'success' ||
           github.event.workflow_run.conclusion == 'failure' ||
           github.event.workflow_run.conclusion == 'timed_out') }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or close one deduplicated issue per regression
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="[Harness] ${WORKFLOW} regression"
          issue="$(gh issue list --state open --limit 500 --json number,title |
            jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)"
          if [[ "$RESULT" == "success" ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "재검증 통과: $RUN_URL (SHA: $HEAD_SHA)"
            fi
            echo "PASS: $WORKFLOW"
            exit 0
          fi
          if [[ -n "$issue" ]]; then
            echo "::warning::Open regression issue #$issue; latest failing run: $RUN_URL"
            exit 0
          fi
          body="$(mktemp)"
          printf '자동 검증 실패: **%s**\n\n- 결과: %s\n- 실행: %s\n- 커밋: %s\n\n자동 정정 범위는 생성 HTML/링크에 한정됩니다. RTL·AXI·전기적 제약·테스트 기대값은 검토 없이 수정하지 않습니다.\n' \
            "$WORKFLOW" "$RESULT" "$RUN_URL" "$HEAD_SHA" > "$body"
          gh issue create --title "$title" --body-file "$body"
