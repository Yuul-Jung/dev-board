name: Devices docs, sources and host verification

on:
  push:
    paths:
      - 'devices/**'
      - '.github/workflows/devices-check.yml'
  pull_request:
    paths:
      - 'devices/**'
      - '.github/workflows/devices-check.yml'
  workflow_dispatch:

# (변경) 자동 생성 HTML을 검증 후 main에 동기화할 수 있도록 쓰기 권한을 부여한다.
permissions:
  contents: write

concurrency:
  group: dev-board-html-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  devices-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and structured-data parse
        run: |
          python3 -m py_compile devices/tools/gen_pages.py devices/tools/check_links.py
          python3 -m json.tool devices/data/devices.json > /dev/null
      # (추가) 캡스톤/모듈 갱신 후 오래된 HTML 목차를 먼저 재생성한다.
      - name: Regenerate HTML indexes before validation
        run: python3 devices/tools/gen_pages.py
      - name: Markdown links and HTML regeneration consistency
        run: |
          python3 devices/tools/check_links.py
          python3 devices/tools/gen_pages.py --check
      - name: C driver host tests (mock only, not board verification)
        run: bash devices/run_host_tests.sh
      - name: AXI4-Lite ultrasonic RTL directed simulation
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          iverilog -g2012 -Wall -s us_axil_top -o /tmp/us_axil_top \
            devices/gpio/rtl/us_axil_top.v \
            devices/gpio/rtl/us_axil_regs.v \
            devices/gpio/rtl/ultrasonic_distance_meter.v
          iverilog -g2012 -Wall -s tb_us_axil_regs -o /tmp/tb_us_axil_regs \
            devices/gpio/rtl/us_axil_regs.v \
            devices/gpio/tb/tb_us_axil_regs.v
          vvp /tmp/tb_us_axil_regs
      - name: AXI4-Lite 1-Wire RTL directed simulation
        run: |
          iverilog -g2012 -Wall -DSIMULATION -s onewire_axil_top -o /tmp/onewire_axil_top \
            devices/1-wire/rtl/onewire_axil_top.v \
            devices/1-wire/rtl/onewire_axil_regs.v \
            devices/1-wire/rtl/onewire_bit_engine.v \
            devices/1-wire/rtl/onewire_iobuf.v
          iverilog -g2012 -Wall -s tb_onewire_axil_regs -o /tmp/tb_onewire_axil_regs \
            devices/1-wire/rtl/onewire_axil_regs.v \
            devices/1-wire/tb/tb_onewire_axil_regs.v
          vvp /tmp/tb_onewire_axil_regs
      - name: AXI4-Lite DHT22 RTL directed simulation
        run: |
          iverilog -g2012 -Wall -DSIMULATION -s dht22_axil_top -o /tmp/dht22_axil_top \
            devices/gpio/rtl/dht22_axil_top.v \
            devices/gpio/rtl/dht22_axil_regs.v \
            devices/gpio/rtl/dht22_engine.v \
            devices/gpio/rtl/dht22_iobuf.v
          iverilog -g2012 -Wall -s tb_dht22_axil_regs -o /tmp/tb_dht22_axil_regs \
            devices/gpio/rtl/dht22_axil_regs.v \
            devices/gpio/tb/tb_dht22_axil_regs.v
          vvp /tmp/tb_dht22_axil_regs
      - name: AXI4-Lite rotary encoder RTL directed simulation
        run: |
          iverilog -g2012 -Wall -s quad_axil_top -o /tmp/quad_axil_top \
            devices/gpio/rtl/quad_axil_top.v \
            devices/gpio/rtl/quad_axil_regs.v \
            devices/gpio/rtl/quad_engine.v
          iverilog -g2012 -Wall -s tb_quad_axil_regs -o /tmp/tb_quad_axil_regs \
            devices/gpio/rtl/quad_axil_regs.v \
            devices/gpio/tb/tb_quad_axil_regs.v
          vvp /tmp/tb_quad_axil_regs

      - name: AXI4-Lite DC motor RTL directed simulation
        run: |
          iverilog -g2012 -Wall -s dcmotor_axil_top -o /tmp/dcmotor_axil_top \
            devices/motor/rtl/dcmotor_axil_top.v \
            devices/motor/rtl/dcmotor_axil_regs.v \
            devices/motor/rtl/dcmotor_engine.v
          iverilog -g2012 -Wall -s tb_dcmotor_axil_regs -o /tmp/tb_dcmotor_axil_regs \
            devices/motor/rtl/dcmotor_axil_regs.v \
            devices/motor/tb/tb_dcmotor_axil_regs.v
          vvp /tmp/tb_dcmotor_axil_regs
      - name: AXI4-Lite servo RTL directed simulation
        run: |
          iverilog -g2012 -Wall -s servo_axil_top -o /tmp/servo_axil_top \
            devices/motor/rtl/servo_axil_top.v \
            devices/motor/rtl/servo_axil_regs.v \
            devices/motor/rtl/servo_engine.v
          iverilog -g2012 -Wall -s tb_servo_axil_regs -o /tmp/tb_servo_axil_regs \
            devices/motor/rtl/servo_axil_regs.v \
            devices/motor/tb/tb_servo_axil_regs.v
          vvp /tmp/tb_servo_axil_regs
          # (추가) 실제 PWM 엔진의 펄스 및 무효 AXI 설정 안전 차단 시험
          iverilog -g2012 -Wall -s tb_servo_engine -o /tmp/tb_servo_engine \
            devices/motor/rtl/servo_engine.v \
            devices/motor/tb/tb_servo_engine.v
          vvp /tmp/tb_servo_engine

      # (추가) push 검증이 모두 통과한 경우에만 생성된 HTML을 저장소에 반영한다.
      # 동시 커밋 충돌 시 최신 main에서 다시 생성하고 검증한 뒤 최대 3회 재시도한다.
      - name: Publish validated generated HTML indexes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' '.nojekyll'
          if git diff --cached --quiet; then
            echo "Generated HTML already matches current sources."
            exit 0
          fi
          git commit -m "docs: sync generated HTML indexes after validation"
          if git push origin HEAD:main; then
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Concurrent update detected; regenerating from latest main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python3 devices/tools/gen_pages.py
            python3 devices/tools/check_links.py
            python3 devices/tools/gen_pages.py --check
            git add -A -- '*.html' '.nojekyll'
            if git diff --cached --quiet; then
              echo "Latest main already has matching generated HTML."
              exit 0
            fi
            git commit -m "docs: sync generated HTML indexes after concurrent update"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "ERROR: failed to publish generated HTML after three retries" >&2
          exit 1
