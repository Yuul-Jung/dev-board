name: RTL mutation check (TB 검출력)
on:
  push:
    paths:
      - 'rtl/verification/rtl/mutate.py'
      - 'rtl/verification/rtl/annot.py'
      - 'rtl/verification/rtl/equivalent.txt'
      - 'rtl/rtl*/src/**'
      - 'rtl/rtl*/tb/**'
      - '.github/workflows/rtl-mutation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: "도구 버전과 대상 커밋"
        run: |
          echo "::notice title=환경::sha=$GITHUB_SHA run=$GITHUB_RUN_ID $(iverilog -V 2>&1 | head -1) | $(python3 --version)"
      - name: "Mutation run (기준선 실패 시 실패, 생존 변형은 경고)"
        run: |
          set +e
          python3 rtl/verification/rtl/mutate.py | tee /tmp/mut.txt
          rc=${PIPESTATUS[0]}
          printf '::notice title=변형 검사 요약::%s\n' "$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/mut.txt | head -c 3400)"
          exit $rc
      - name: "생존 변형 전체 목록 (1~10)"
        if: always()
        run: python3 rtl/verification/rtl/annot.py rtl/verification/rtl/results/mutation_survivors.txt 생존변형 0
      - name: "생존 변형 전체 목록 (11~20)"
        if: always()
        run: python3 rtl/verification/rtl/annot.py rtl/verification/rtl/results/mutation_survivors.txt 생존변형 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl-mutation
          path: rtl/verification/rtl/results/mutation*
          if-no-files-found: warn
